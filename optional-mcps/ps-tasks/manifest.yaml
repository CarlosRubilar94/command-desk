# Nous-approved MCP catalog entry.
# Presence in this directory = approval. Merged via PR review.
manifest_version: 1

name: ps-tasks
description: List and run Windows Task Scheduler tasks and PowerShell scripts.
source: https://github.com/CarlosRubilar94/command-desk/tree/main/docs/setup

# Node.js MCP server for Windows Task Scheduler. Uses PowerShell
# Get-ScheduledTask and Start-ScheduledTask cmdlets. WINDOWS ONLY.
transport:
  type: stdio
  command: node
  args:
    - "${INSTALL_DIR}/powershell-tasks-mcp.js"

install:
  type: git
  url: https://github.com/CarlosRubilar94/command-desk.git
  ref: main
  bootstrap:
    - "cp docs/setup/mcp-scripts/powershell-tasks-mcp.js ."
    - "cp docs/setup/mcp-scripts/mcp-lib.js ."

auth:
  type: none

# Status: READY-WAITING-LOCAL-SERVICE (Windows only — requires Windows Task Scheduler)

post_install: |
  WINDOWS ONLY. Requires Windows Task Scheduler (svchost.exe, Schedule).
  Some operations may require elevated privileges.

  Available tools: ps_task_list, ps_task_run, ps_task_health_check,
  ps_task_backup_mcp.
